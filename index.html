<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vitezov matematični labirint</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4efe1;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .instructions {
      max-width: 820px;
      margin: 0 auto 14px;
      line-height: 1.5;
      font-size: 1.05rem;
    }

    .arrow-help {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 8px 0;
    }

    #message {
      min-height: 38px;
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #fireStatus {
      min-height: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #maze {
      display: grid;
      width: fit-content;
      margin: 0 auto;
      border: 5px solid #473d32;
      background: white;
    }

    .cell {
      width: 34px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    .wall {
      background: #48515c;
    }

    .path {
      background: #fffaf0;
    }

    .goal {
      background: #ffeaa7;
    }

    .knight {
      font-size: 24px;
      z-index: 5;
    }

    .castle {
      font-size: 27px;
    }

    .dragon-small {
      font-size: 18px;
    }

    .dragon-medium {
      font-size: 23px;
    }

    .dragon-large {
      font-size: 29px;
    }

    .fire {
      position: absolute;
      z-index: 3;
    }

    .fire-on {
      font-size: 26px;
      animation: burn 0.45s infinite alternate;
    }

    .fire-off {
      font-size: 17px;
      opacity: 0.25;
    }

    @keyframes burn {
      from {
        transform: scale(0.88) translateY(2px);
      }

      to {
        transform: scale(1.12) translateY(-2px);
      }
    }

    .controls {
      margin: 18px auto 0;
      width: 230px;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 7px 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .move-button {
      min-width: 62px;
      min-height: 52px;
      font-size: 26px;
      border: 2px solid #333;
      border-radius: 12px;
      background: white;
      font-weight: bold;
    }

    .attack-button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      font-size: 18px;
      border: 2px solid #333;
      border-radius: 12px;
      background: white;
      font-weight: bold;
    }

    #restart {
      margin-top: 14px;
      padding: 10px 18px;
      border: 2px solid #333;
      border-radius: 10px;
      background: white;
      font-weight: bold;
    }

    #mathOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.58);
      z-index: 20;
      padding: 20px;
    }

    #mathOverlay.visible {
      display: flex;
    }

    .math-card {
      width: min(430px, 92%);
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    #dragonPreview {
      margin-bottom: 6px;
    }

    #progress {
      font-weight: bold;
      margin-bottom: 8px;
    }

    #problem {
      font-size: 2.6rem;
      font-weight: bold;
      margin: 16px 0;
    }

    #answer {
      width: 145px;
      padding: 10px;
      text-align: center;
      font-size: 1.8rem;
      border: 2px solid #555;
      border-radius: 10px;
    }

    #submitAnswer {
      display: block;
      margin: 16px auto 0;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 1.05rem;
      cursor: pointer;
    }

    #feedback {
      min-height: 28px;
      margin-top: 12px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    @media (max-width: 850px) {
      .cell {
        width: 27px;
        height: 27px;
      }

      .knight {
        font-size: 19px;
      }

      .castle {
        font-size: 21px;
      }

      .dragon-small {
        font-size: 14px;
      }

      .dragon-medium {
        font-size: 18px;
      }

      .dragon-large {
        font-size: 22px;
      }

      .fire-on {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <h1>⚔️ Vitezov matematični labirint 🏰</h1>

  <div class="instructions">
    Poišči pot do gradu.

    <div class="arrow-help">
      ← &nbsp; ↑ &nbsp; ↓ &nbsp; →
    </div>

    Premikaj viteza s puščicami.

    <br><br>

    🐉 Ko prideš do zmaja, klikni <strong>⚔️ MEČ</strong> in reši račun.

    <br>

    🔥 Ko ogenj ugasne, hitro pojdi mimo.
  </div>

  <div id="message">
    Poišči pot do gradu.
  </div>

  <div id="fireStatus"></div>

  <div id="maze"></div>

  <div class="controls">

    <div class="controls-row">
      <button class="move-button" data-direction="up">↑</button>
    </div>

    <div class="controls-row">
      <button class="move-button" data-direction="left">←</button>
      <button class="move-button" data-direction="down">↓</button>
      <button class="move-button" data-direction="right">→</button>
    </div>

    <button class="attack-button" id="attackButton">
      ⚔️ MEČ
    </button>

  </div>

  <button id="restart">
    🔄 Nov labirint
  </button>


  <div id="mathOverlay">

    <div class="math-card">

      <div id="dragonPreview"></div>

      <h2>🐉 Premagaj zmaja!</h2>

      <div id="progress"></div>

      <div id="problem"></div>

      <input
        id="answer"
        type="number"
        inputmode="numeric"
        autocomplete="off"
        aria-label="Vpiši odgovor"
      />

      <button id="submitAnswer">
        Preveri odgovor
      </button>

      <div id="feedback"></div>

    </div>

  </div>


<script>

const ROWS = 19;
const COLS = 25;

const NUMBER_OF_FIRES = 4;

let maze = [];

let player = {
  row: 1,
  col: 1
};

let castle = {
  row: ROWS - 2,
  col: COLS - 2
};

let dragons = [];
let fires = [];

let fireIsOn = true;
let fireTimer = null;

let activeDragon = null;
let correctAnswer = null;
let gameWon = false;


const mazeElement =
  document.getElementById("maze");

const messageElement =
  document.getElementById("message");

const fireStatus =
  document.getElementById("fireStatus");

const overlay =
  document.getElementById("mathOverlay");

const problemElement =
  document.getElementById("problem");

const progressElement =
  document.getElementById("progress");

const dragonPreview =
  document.getElementById("dragonPreview");

const answerInput =
  document.getElementById("answer");

const feedbackElement =
  document.getElementById("feedback");


function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [array[i], array[j]] =
    [array[j], array[i]];
  }

  return array;
}


/* ================================
   BOLJ KOMPLEKSEN LABIRINT
================================ */

function generateMaze() {

  maze =
    Array.from(
      { length: ROWS },
      () => Array(COLS).fill(1)
    );

  const directions = [
    [-2, 0],
    [2, 0],
    [0, -2],
    [0, 2]
  ];

  function carve(row, col) {

    maze[row][col] = 0;

    const dirs =
      shuffle(
        [...directions]
      );

    for (
      const [dr, dc] of dirs
    ) {

      const nr =
        row + dr;

      const nc =
        col + dc;

      if (
        nr > 0 &&
        nr < ROWS - 1 &&
        nc > 0 &&
        nc < COLS - 1 &&
        maze[nr][nc] === 1
      ) {

        maze[
          row + dr / 2
        ][
          col + dc / 2
        ] = 0;

        carve(nr, nc);
      }
    }
  }

  carve(1, 1);


  /*
    Dodatne povezave med hodniki:
    nastanejo križišča in zanke.
  */

  const EXTRA_OPENINGS = 28;

  let openingsMade = 0;
  let attempts = 0;

  while (
    openingsMade < EXTRA_OPENINGS &&
    attempts < 800
  ) {

    attempts++;

    const row =
      Math.floor(
        Math.random() *
        (ROWS - 2)
      ) + 1;

    const col =
      Math.floor(
        Math.random() *
        (COLS - 2)
      ) + 1;

    if (
      maze[row][col] !== 1
    ) {
      continue;
    }

    const up =
      maze[row - 1]?.[col] === 0;

    const down =
      maze[row + 1]?.[col] === 0;

    const left =
      maze[row]?.[col - 1] === 0;

    const right =
      maze[row]?.[col + 1] === 0;

    if (
      (up && down) ||
      (left && right)
    ) {

      maze[row][col] = 0;

      openingsMade++;
    }
  }


  /*
    Dodatne slepe poti.
  */

  const EXTRA_DEAD_ENDS = 16;

  let deadEndsMade = 0;
  attempts = 0;

  while (
    deadEndsMade < EXTRA_DEAD_ENDS &&
    attempts < 800
  ) {

    attempts++;

    const row =
      Math.floor(
        Math.random() *
        (ROWS - 2)
      ) + 1;

    const col =
      Math.floor(
        Math.random() *
        (COLS - 2)
      ) + 1;

    if (
      maze[row][col] !== 1
    ) {
      continue;
    }

    let openNeighbours = 0;

    if (
      maze[row - 1]?.[col] === 0
    ) openNeighbours++;

    if (
      maze[row + 1]?.[col] === 0
    ) openNeighbours++;

    if (
      maze[row]?.[col - 1] === 0
    ) openNeighbours++;

    if (
      maze[row]?.[col + 1] === 0
    ) openNeighbours++;

    if (
      openNeighbours === 1
    ) {

      maze[row][col] = 0;

      deadEndsMade++;
    }
  }

  player = {
    row: 1,
    col: 1
  };

  castle = {
    row: ROWS - 2,
    col: COLS - 2
  };

  maze[castle.row][castle.col] = 0;
}


/* ================================
   NAJDI POT
================================ */

function findPathToCastle() {

  const queue = [
    {
      row: player.row,
      col: player.col,
      path: []
    }
  ];

  const visited =
    new Set();

  visited.add(
    `${player.row},${player.col}`
  );

  const dirs = [
    [-1, 0],
    [1, 0],
    [0, -1],
    [0, 1]
  ];

  while (
    queue.length
  ) {

    const current =
      queue.shift();

    const newPath = [
      ...current.path,
      {
        row: current.row,
        col: current.col
      }
    ];

    if (
      current.row === castle.row &&
      current.col === castle.col
    ) {
      return newPath;
    }

    for (
      const [dr, dc] of dirs
    ) {

      const nr =
        current.row + dr;

      const nc =
        current.col + dc;

      const key =
        `${nr},${nc}`;

      if (
        maze[nr]?.[nc] === 0 &&
        !visited.has(key)
      ) {

        visited.add(key);

        queue.push({
          row: nr,
          col: nc,
          path: newPath
        });
      }
    }
  }

  return [];
}


/* ================================
   ZMAJI
================================ */

function placeDragons() {

  const path =
    findPathToCastle();

  dragons = [];

  const fractions = [
    0.18,
    0.35,
    0.53,
    0.70,
    0.84
  ];

  const types = [
    {
      type: "small",
      questions: 1
    },
    {
      type: "medium",
      questions: 2
    },
    {
      type: "small",
      questions: 1
    },
    {
      type: "medium",
      questions: 2
    },
    {
      type: "large",
      questions: 3
    }
  ];

  fractions.forEach(
    (fraction, index) => {

      const position =
        path[
          Math.floor(
            path.length * fraction
          )
        ];

      if (
        !position
      ) return;

      dragons.push({
        row: position.row,
        col: position.col,
        type: types[index].type,
        questions: types[index].questions,
        remaining: types[index].questions
      });
    }
  );
}


function getDragonAt(row, col) {

  return dragons.find(
    dragon =>
      dragon.row === row &&
      dragon.col === col
  );
}


/* ================================
   OGENJ
================================ */

function placeFires() {

  const path =
    findPathToCastle();

  fires = [];

  const candidates =
    path.slice(
      5,
      path.length - 5
    );

  shuffle(candidates);

  for (
    const position of candidates
  ) {

    if (
      fires.length >=
      NUMBER_OF_FIRES
    ) {
      break;
    }

    if (
      getDragonAt(
        position.row,
        position.col
      )
    ) {
      continue;
    }

    const tooClose =
      fires.some(
        fire =>
          Math.abs(
            fire.row -
            position.row
          )
          +
          Math.abs(
            fire.col -
            position.col
          )
          < 5
      );

    if (
      tooClose
    ) {
      continue;
    }

    fires.push({
      row: position.row,
      col: position.col
    });
  }
}


function getFireAt(row, col) {

  return fires.find(
    fire =>
      fire.row === row &&
      fire.col === col
  );
}


function startFireTimer() {

  if (
    fireTimer
  ) {
    clearInterval(
      fireTimer
    );
  }

  fireIsOn =
    true;

  updateFireStatus();

  fireTimer =
    setInterval(
      () => {

        fireIsOn =
          !fireIsOn;

        updateFireStatus();

        drawMaze();

      },
      2000
    );
}


function updateFireStatus() {

  if (
    fireIsOn
  ) {

    fireStatus.textContent =
      "🔥 Ogenj gori – počakaj!";

  } else {

    fireStatus.textContent =
      "✅ Ogenj je ugasnil – zdaj hitro mimo!";
  }
}


/* ================================
   RISANJE
================================ */

function drawMaze() {

  mazeElement.innerHTML =
    "";

  mazeElement.style
    .gridTemplateColumns =
    `repeat(${COLS}, auto)`;

  for (
    let row = 0;
    row < ROWS;
    row++
  ) {

    for (
      let col = 0;
      col < COLS;
      col++
    ) {

      const cell =
        document.createElement(
          "div"
        );

      cell.classList.add(
        "cell"
      );

      if (
        maze[row][col] === 1
      ) {

        cell.classList.add(
          "wall"
        );

      } else {

        cell.classList.add(
          "path"
        );
      }


      if (
        row === castle.row &&
        col === castle.col
      ) {

        cell.classList.add(
          "goal"
        );

        const icon =
          document.createElement(
            "span"
          );

        icon.className =
          "castle";

        icon.textContent =
          "🏰";

        cell.appendChild(
          icon
        );
      }


      const fire =
        getFireAt(
          row,
          col
        );

      if (
        fire
      ) {

        const fireIcon =
          document.createElement(
            "span"
          );

        fireIcon.classList.add(
          "fire"
        );

        if (
          fireIsOn
        ) {

          fireIcon.classList.add(
            "fire-on"
          );

          fireIcon.textContent =
            "🔥";

        } else {

          fireIcon.classList.add(
            "fire-off"
          );

          fireIcon.textContent =
            "○";
        }

        cell.appendChild(
          fireIcon
        );
      }


      const dragon =
        getDragonAt(
          row,
          col
        );

      if (
        dragon
      ) {

        const d =
          document.createElement(
            "span"
          );

        d.textContent =
          "🐉";

        d.className =
          `dragon-${dragon.type}`;

        cell.appendChild(
          d
        );
      }


      if (
        player.row === row &&
        player.col === col
      ) {

        const knight =
          document.createElement(
            "span"
          );

        knight.className =
          "knight";

        knight.textContent =
          "🛡️";

        cell.appendChild(
          knight
        );
      }


      mazeElement.appendChild(
        cell
      );
    }
  }
}


/* ================================
   PREMIKANJE
================================ */

function movePlayer(direction) {

  if (
    gameWon ||
    activeDragon
  ) {
    return;
  }

  let nextRow =
    player.row;

  let nextCol =
    player.col;

  if (
    direction === "up"
  ) nextRow--;

  if (
    direction === "down"
  ) nextRow++;

  if (
    direction === "left"
  ) nextCol--;

  if (
    direction === "right"
  ) nextCol++;


  if (
    maze[nextRow]?.[nextCol] !== 0
  ) {

    messageElement.textContent =
      "🧱 Tukaj je zid.";

    return;
  }


  const dragon =
    getDragonAt(
      nextRow,
      nextCol
    );

  if (
    dragon
  ) {

    messageElement.textContent =
      "🐉 Zmaj ti zapira pot! Klikni ⚔️ MEČ.";

    return;
  }


  player.row =
    nextRow;

  player.col =
    nextCol;


  const fire =
    getFireAt(
      player.row,
      player.col
    );

  if (
    fire &&
    fireIsOn
  ) {

    messageElement.textContent =
      "🔥 Ojoj! Stopil si v ogenj. Pojavil se je nov zmaj!";

    spawnExtraDragon();
  }


  drawMaze();


  if (
    player.row === castle.row &&
    player.col === castle.col
  ) {

    winGame();

  } else {

    checkNearbyDragon();
  }
}


/* ================================
   DODATNI ZMAJ
================================ */

function spawnExtraDragon() {

  if (
    dragons.length >= 10
  ) {
    return;
  }

  const possible = [];

  for (
    let row = 1;
    row < ROWS - 1;
    row++
  ) {

    for (
      let col = 1;
      col < COLS - 1;
      col++
    ) {

      if (
        maze[row][col] !== 0
      ) {
        continue;
      }

      if (
        row === player.row &&
        col === player.col
      ) {
        continue;
      }

      if (
        row === castle.row &&
        col === castle.col
      ) {
        continue;
      }

      if (
        getDragonAt(
          row,
          col
        )
      ) {
        continue;
      }

      if (
        getFireAt(
          row,
          col
        )
      ) {
        continue;
      }

      const distance =
        Math.abs(
          row - player.row
        )
        +
        Math.abs(
          col - player.col
        );

      if (
        distance < 6
      ) {
        continue;
      }

      possible.push({
        row,
        col
      });
    }
  }

  if (
    possible.length === 0
  ) {
    return;
  }

  const chosen =
    possible[
      Math.floor(
        Math.random() *
        possible.length
      )
    ];

  dragons.push({
    row: chosen.row,
    col: chosen.col,
    type: "small",
    questions: 1,
    remaining: 1
  });
}


/* ================================
   ZMAJ V BLIŽINI
================================ */

function findNearbyDragon() {

  const dirs = [
    [-1,0],
    [1,0],
    [0,-1],
    [0,1]
  ];

  for (
    const [dr, dc] of dirs
  ) {

    const dragon =
      getDragonAt(
        player.row + dr,
        player.col + dc
      );

    if (
      dragon
    ) {
      return dragon;
    }
  }

  return null;
}


function checkNearbyDragon() {

  const dragon =
    findNearbyDragon();

  if (
    dragon
  ) {

    messageElement.textContent =
      "🐉 Zmaj je blizu! Klikni ⚔️ MEČ.";
  }
}


/* ================================
   NAPAD
================================ */

function attackDragon() {

  const dragon =
    findNearbyDragon();

  if (
    !dragon
  ) {

    messageElement.textContent =
      "⚔️ V bližini ni zmaja.";

    return;
  }

  activeDragon =
    dragon;

  showDragon();

  createMathProblem();

  overlay.classList.add(
    "visible"
  );

  setTimeout(
    () =>
      answerInput.focus(),
    50
  );
}


function showDragon() {

  let size =
    36;

  if (
    activeDragon.type ===
    "medium"
  ) {
    size = 52;
  }

  if (
    activeDragon.type ===
    "large"
  ) {
    size = 72;
  }

  dragonPreview.innerHTML =
    `<span style="font-size:${size}px">🐉</span>`;

  const current =
    activeDragon.questions
    -
    activeDragon.remaining
    +
    1;

  progressElement.textContent =
    `Račun ${current} od ${activeDragon.questions}`;
}


/* ================================
   RAČUNI
================================ */

function createMathProblem() {

  const operation =
    Math.random() < 0.5
      ? "+"
      : "−";

  let a;
  let b;

  if (
    operation === "+"
  ) {

    const result =
      randomNumber(
        6,
        20
      );

    a =
      randomNumber(
        1,
        result - 1
      );

    b =
      result - a;

    correctAnswer =
      result;

  } else {

    a =
      randomNumber(
        7,
        20
      );

    const result =
      randomNumber(
        6,
        a - 1
      );

    b =
      a - result;

    correctAnswer =
      result;
  }

  problemElement.textContent =
    `${a} ${operation} ${b} = ?`;

  answerInput.value =
    "";

  feedbackElement.textContent =
    "";
}


function randomNumber(min, max) {

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;
}


/* ================================
   PREVERJANJE
================================ */

function checkAnswer() {

  if (
    !activeDragon
  ) {
    return;
  }

  if (
    answerInput.value.trim() === ""
  ) {

    feedbackElement.textContent =
      "Najprej vpiši odgovor.";

    return;
  }

  const answer =
    Number(
      answerInput.value
    );

  if (
    answer === correctAnswer
  ) {

    activeDragon.remaining--;

    if (
      activeDragon.remaining > 0
    ) {

      feedbackElement.textContent =
        "✅ Pravilno! Še en račun.";

      setTimeout(
        () => {

          showDragon();

          createMathProblem();

          answerInput.focus();

        },
        600
      );

    } else {

      const defeated =
        activeDragon;

      feedbackElement.textContent =
        "🎉 Zmaj je premagan!";

      setTimeout(
        () => {

          dragons =
            dragons.filter(
              d => d !== defeated
            );

          activeDragon =
            null;

          overlay.classList.remove(
            "visible"
          );

          messageElement.textContent =
            "⚔️ Nadaljuj proti gradu!";

          drawMaze();

        },
        700
      );
    }

  } else {

    feedbackElement.textContent =
      "❌ Poskusi še enkrat.";

    answerInput.select();
  }
}


/* ================================
   ZMAGA
================================ */

function winGame() {

  gameWon =
    true;

  messageElement.textContent =
    "🏰 Bravo! Prišel si do gradu! 🎉";
}


/* ================================
   NOVA IGRA
================================ */

function newGame() {

  gameWon =
    false;

  activeDragon =
    null;

  overlay.classList.remove(
    "visible"
  );

  generateMaze();

  placeDragons();

  placeFires();

  startFireTimer();

  drawMaze();

  messageElement.textContent =
    "Poišči pot do gradu.";
}


/* ================================
   TIPKOVNICA
================================ */

document.addEventListener(
  "keydown",
  event => {

    if (
      activeDragon
    ) {

      if (
        event.key === "Enter"
      ) {
        checkAnswer();
      }

      return;
    }

    if (
      event.key === "ArrowUp"
    ) {
      event.preventDefault();
      movePlayer("up");
    }

    if (
      event.key === "ArrowDown"
    ) {
      event.preventDefault();
      movePlayer("down");
    }

    if (
      event.key === "ArrowLeft"
    ) {
      event.preventDefault();
      movePlayer("left");
    }

    if (
      event.key === "ArrowRight"
    ) {
      event.preventDefault();
      movePlayer("right");
    }

    if (
      event.code === "Space"
    ) {
      event.preventDefault();
      attackDragon();
    }
  }
);


/* ================================
   GUMBI
================================ */

document
  .querySelectorAll(
    ".move-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          movePlayer(
            button.dataset.direction
          );
        }
      );
    }
  );


document
  .getElementById(
    "attackButton"
  )
  .addEventListener(
    "click",
    attackDragon
  );


document
  .getElementById(
    "submitAnswer"
  )
  .addEventListener(
    "click",
    checkAnswer
  );


document
  .getElementById(
    "restart"
  )
  .addEventListener(
    "click",
    newGame
  );


newGame();

</script>

</body>
</html>
